<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SnapTiles</title>
    <meta name="description" content="Build vehicles out of square tiles and drive, fly or walk them in the browser. Reads RigidChips .rc models and Lua scripts." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <aside id="side">
      <header id="bar">
        <nav id="samples"></nav>
        <button id="viewmode" type="button" aria-label="view">◎</button>
        <button id="mute" type="button" aria-label="sound">🔊</button>
        <button id="build" type="button" aria-pressed="false">組む</button>
        <button id="run" type="button" aria-label="run">▶</button>
      </header>
      <section id="builder" hidden aria-label="モデル編集">
        <div class="edit-row"><button id="new-model">新規</button><button id="save-model">保存</button><button id="edit-undo" aria-label="取り消し">↶</button><button id="edit-redo" aria-label="やり直し">↷</button></div>
        <label>部品<select id="parts" size="5"></select></label>
        <div class="edit-row"><label>種類<select id="part-type"></select></label><label>角度<input id="part-angle" type="text" inputmode="decimal" /></label><button id="part-delete">削除</button></div>
        <div id="angle-control-row" class="edit-row" hidden><label>角度の操作<select id="angle-control"></select></label></div>
        <div id="power-row" class="edit-row" hidden><label>出力<input id="part-power" type="text" inputmode="decimal" /></label><label>操作<select id="power-control"></select></label></div>
        <div class="edit-row"><label>追加する部品<select id="add-type"></select></label><div class="edges" aria-label="接続方向"><button data-edge="N">N ＋</button><button data-edge="W">W ＋</button><button data-edge="E">E ＋</button><button data-edge="S">S ＋</button></div></div>
      </section>
      <textarea id="source" spellcheck="false" wrap="off"></textarea>
      <footer id="status"></footer>
    </aside>
    <main id="stage">
      <canvas id="view"></canvas>
      <canvas id="hud"></canvas>
      <pre id="vals"></pre>
      <pre id="out"></pre>
      <div id="keys"></div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
