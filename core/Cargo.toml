[package]
name = "snaptiles-core"
version = "0.1.0"
edition = "2021"
description = "SnapTiles simulation core: Rapier physics and the model's Lua, native and WebAssembly (Emscripten)"
license = "AGPL-3.0-or-later"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "snaptiles_core"
path = "src/main.rs"

[dependencies]
mlua = { version = "0.12.2", features = ["lua54", "vendored"] }
rapier3d = "0.36.1"
# versions are pinned with `cargo add` once fetched (see README in this directory)

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[dev-dependencies]
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
