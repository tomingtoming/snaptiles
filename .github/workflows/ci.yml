name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run test
      - run: bun x playwright install --with-deps chromium firefox webkit
      - run: bun run test:plane
        timeout-minutes: 2
      - run: bun run test:editor:scale
        timeout-minutes: 2
      - run: bun run test:editor
        timeout-minutes: 7
      - run: bun run test:editor:firefox
        timeout-minutes: 3
      - run: bun run test:editor:webkit
        timeout-minutes: 3
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: editor-screenshots
          path: .shots/*.png
